{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Locker Room</title>
    <audio id="bg-music" src="{% static 'audio/ES_Before Chill - Yomoti.mp3' %}" autoplay loop></audio>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/repkin_modals.css' %}">
    <link rel="stylesheet" href="{% static 'css/locker_room.css' %}">
</head>

<body>
    <div class="stage">
        <img src="{%static 'img/stat_bars.png'%}" alt="Status bar" class="stats-bar">
        <img src="{% static 'img/locker_room.png' %}" alt="Locker room" class="room">
        <img src="{% static arm_gif %}" alt="Repkin" class="user-base-gif" id="repkin-sprite">

        <!-- Home page return button -->
        <a href="{% url 'core:home' %}" class="home-page-btn" id="home-page-btn"
            aria-label="Back to workout room"></a>

        <!-- Arms arrow: switches to the next arm version (invisible, over the drawn arrow) -->
        <a href="?arms={{ next_arms }}" id="arms-arrow-btn" class="stage_button"
            aria-label="Change Repkin arms"
            style="display:block; --l:80.5%; --t:75.7%; --w:17.5%; --h:5.6%"></a>


        <button class="main_menu_button"
            id="mainMenuButton"
            aria-label="Open menu"
            aria-expanded="false">
        </button>

        <button type="button" id="customize-btn" class="stage_button" aria-haspopup="dialog"
            style="--l:46%; --t:0.8%; --w:14.5%; --h:7.8%">
        </button>

<!-- Main Menu -->
    <div id="mainMenu" class="main_menu hidden">
        <div class="menu_panel">

            <img id="menuArt"
                src="{% static 'img/main_menu_pngs/main_menu_starter.png' %}"
                alt="Main Menu" class="main_menu_png"
                data-lbs-on="{% static 'img/main_menu_pngs/main_menu_starter.png' %}"
                data-lbs-off="{% static 'img/main_menu_pngs/main_menu_lbs_off.png' %}"
                data-kgs-on="{% static 'img/main_menu_pngs/main_menu_kgs_on.png' %}"
                data-kgs-off="{% static 'img/main_menu_pngs/main_menu_kgs_off.png' %}">

            <button type="button" id="menuExitButton" class="menu_field" aria-label="Close menu"
                    style="--l:85%; --t:5.2%; --w:5.2%; --h:4.6%"></button>

            <!-- Name -->
            <input class="menu_field" readonly value="{{ user.first_name }}" aria-label="Current Repkin name"
                style="--l:55.5%; --t:19.7%; --w:20%; --h:2.7%">
            <form class="menu_form">
                <input class="menu_field" name="name" aria-label="Change Repkin name"
                    style="--l:55.5%; --t:23.3%; --w:20%; --h:2.7%">
                <button type="submit" class="menu_field" aria-label="Submit Repkin name"
                        style="--l:68%; --t:26%; --w:8%; --h:1.8%"></button>
            </form>

            <!-- Username -->
            <input class="menu_field" readonly value="{{ user.username }}" aria-label="Current  username"
                style="--l:55.5%; --t:32%; --w:20%; --h:2.7%">
            <form class="menu_form">
                <input class="menu_field" name="username" aria-label="Change username"
                    style="--l:55.5%; --t:35.5%; --w:20%; --h:2.7%">
                <button type="submit" class="menu_field" aria-label="Submit username"
                        style="--l:68%; --t:38.5%; --w:8%; --h:1.8%"></button>
            </form>

            <!-- Height -->
            <input class="menu_field" readonly aria-label="Current height"
                style="--l:55.9%; --t:48.5%; --w:20%; --h:2.7%">
            <form class="menu_form">
                <input class="menu_field" name="height" aria-label="Update height"
                    style="--l:55.8%; --t:52%; --w:20%; --h:2.7%">
                <button type="submit" class="menu_field" aria-label="Submit height"
                        style="--l:69%; --t:54.5%; --w:8%; --h:1.8%"></button>
            </form>

            <!-- Weight -->
            <input class="menu_field" readonly aria-label="Current weight"
                style="--l:55.9%; --t:61.1%; --w:20%; --h:2.6%">
            <form class="menu_form">
                <input class="menu_field" name="weight" aria-label="Update weight"
                    style="--l:55.9%; --t:64.5%; --w:20%; --h:2.4%">
                <button type="submit" class="menu_field" aria-label="Submit weight"
                        style="--l:69%; --t:67%; --w:8%; --h:1.8%"></button>
            </form>

            <!-- Bottom buttons -->
            <button type="button" class="menu_field" aria-label="Credits"
                    style="--l:65.5%; --t:88.7%; --w:10%; --h:3.7%"></button>
            <form method="post" action="{% url 'core:logout' %}">
                {% csrf_token %}
                <button type="submit" class="menu_field" aria-label="Log out"
                        style="--l:77.5%; --t:88.7%; --w:12%; --h:3.7%"></button>
            </form>

            <!-- Credits button (invisible, over the drawn Credits box) -->
            <button type="button" id="creditsButton" class="menu_field" aria-label="View credits"
                style="--l:65.5%; --t:88.7%; --w:10%; --h:3.7%"></button>

            <!-- Credits screen, laid over the menu -->
            <div id="creditsOverlay" class="credits_overlay hidden">
                <img src="{% static 'img/credits.png' %}" alt="Credits" class="credits_png">
                <button type="button" id="creditsExitButton" class="credits_exit_button" aria-label="Close credits"></button>
            </div>

            <!-- Music Control -->
            <button type="button" id="musicBtn" class="menu_field" aria-label="Music" aria-pressed="true"
                style="--l:40.8%; --t:77.7%; --w:3.8%; --h:3.2%"></button>
            <button type="button" id="lbsBtn" class="menu_field" aria-label="Pounds" aria-pressed="true"
                    style="--l:40.8%; --t:84.2%; --w:3.8%; --h:3.3%"></button>
            <button type="button" id="kgsBtn" class="menu_field" aria-label="Kilograms" aria-pressed="false"
                    style="--l:46.9%; --t:84.2%; --w:3.8%; --h:3.3%"></button>
        </div>
    </div>

{%include "core/_repkin_modals.html" %}
<script src="{% static 'js/main_menu.js' %}"></script>
</body>

</html>
