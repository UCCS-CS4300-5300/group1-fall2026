{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Locker Room</title>
    <audio id="bg-music" src="{% static 'audio/ES_Before Chill - Yomoti.mp3' %}" autoplay loop></audio>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/locker_room.css' %}">
    <link rel="stylesheet" href="{% static 'css/repkin_modals.css' %}">
    <link rel="stylesheet" href="{% static 'css/repkin_bubble.css' %}">
</head>

<body>
    <div class="stage">
        <img src="{% static 'img/stat_bars.png' %}" alt="Status bar" class="stats-bar">
        <img src="{% static 'img/locker_room.png' %}" alt="Locker room" class="room">
        <img src="{% static arm_gif %}" alt="Repkin" class="user-base-gif" id="repkin-sprite">
        {% include "core/_repkin_bubble.html" with bubble_kinds="idle" bubble_left="42%" %}

        <!-- Home page return button -->
        <a href="{% url 'core:home' %}" class="home-page-btn" id="home-page-btn"
            aria-label="Back to workout room"></a>

        <!-- Arms arrow: arm_toggle.js swaps the picture without reloading; href is a backup -->
        <a href="?arms={{ next_arms }}" id="arms-arrow-btn" class="stage_button"
            aria-label="Change Repkin arms"
            data-arm-level="{{ arm_level }}"
            style="display:block; --l:80.5%; --t:75.7%; --w:17.5%; --h:5.6%"></a>
        {{ arm_gif_urls|json_script:"arm-gif-urls" }}

        <button class="main_menu_button" id="mainMenuButton"
            aria-label="Open menu" aria-expanded="false"></button>

        <button type="button" id="customize-btn" class="stage_button"
            aria-label="Customize RepKin" aria-haspopup="dialog"
            style="--l:46%; --t:0.8%; --w:14.5%; --h:7.8%"></button>

        {% include "core/main_menu.html" %}
    </div>

    {% include "core/_repkin_modals.html" %}

    <script src="{% static 'js/unit_conversion.js' %}"></script>
    <script src="{% static 'js/main_menu.js' %}"></script>
    <script src="{% static 'js/profile.js' %}"></script>
    <script src="{% static 'core/arm_toggle.js' %}"></script>
</body>
</html>
