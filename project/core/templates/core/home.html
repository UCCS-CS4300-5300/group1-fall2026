{% load static %}
<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <style>
        html, body {

            height: 100vh;

        }
        .user-base-gif {

            position: absolute;
            top: 83%;

        }
    </style>

</head>
