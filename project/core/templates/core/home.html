{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <audio id="bg-music" src="{% static 'audio/side-stepping-prigida-main-version-21377-01-09.mp3' %}" autoplay loop></audio>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow:hidden;
        }

        .full-page-img {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: contain;
            object-position: center;
        }
        .user-base-gif {

            position: absolute;
            top: 83%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; /* Adjust the size as needed */
            height: auto;
        }
    </style>

     <form method="post" action="{% url 'core:logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>

</head>
<body>
<img src="{% static 'img/workout_room.png' %}" alt="Full Page Image" class="full-page-img">
<img src="{% static 'gifs/(Base)TiredAnimation.gif' %}" alt="user base" class="user-base-gif">

        <main>
            {% block content %}{% endblock %}
        </main
    </body>
</html>
