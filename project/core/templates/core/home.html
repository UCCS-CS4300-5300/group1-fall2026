{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <audio id="bg-music" src="{% static 'audio/side-stepping-prigida-main-version-21377-01-09.mp3' %}" autoplay loop></audio>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/repkin_modals.css' %}">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow:hidden;
        }

        .full-page-img {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: contain;
            object-position: center;
        }
        .user-base-gif {

            position: absolute;
            top: 83%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; /* Adjust the size as needed */
            height: auto;
        }
    </style>


</head>

<body>
    <form method="post" action="{% url 'core:logout' %}" class="logout-form">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>

    <div class="stage">
        <img src="{% static 'img/workout_room.png' %}" alt="Workout room" class="room">
        <img src="{% static 'gifs/(Base)TiredAnimation.gif' %}" alt="Repkin" class="user-base-gif">
S
        <button class="main_menu_button" id="mainMenuButton" aria-label="Open menu"></button>
    <button type="button" id="customize-btn">Customize RepKin</button>

    <button
        type="button"
        id="log-exercise-btn"
        data-exercise-modal="exercise-modal">
        Log Exercise
    </button>

    <form method="post" action="{% url 'core:logout' %}">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    <p>Signed in as {{ user.username }}</p>
    <p>{{ user.username }}'s Repkin: mood {{ repkin.mood }}, color {{ repkin.color }}</p>
    <img src="{% static 'img/workout_room.png' %}" alt="Full Page Image" class="full-page-img">
    <img src="{% static 'gifs/(Base)TiredAnimation.gif' %}" alt="user base" class="user-base-gif">

        <div id="mainMenu" class="main_menu hidden"S>
            <img src="{% static 'img/main_menu_starter.png' %}" alt="Main Menu" class="main_menu_png">
        </div>
    </div>

    <script>
        const menu = document.getElementById("mainMenu");

        document.getElementById("mainMenuButton").addEventListener("click", () => {
            menu.classList.toggle("hidden");
        });

        // close only when clicking the dark backdrop, not the menu art itself
        menu.addEventListener("click", (e) => {
            if (e.target === menu) menu.classList.add("hidden");
            if (event.key === 'Escape' || event.keyCode===27){
                const popup = document.getElementById('menu');
            }
        });


    </script>
    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "core/_repkin_modals.html" %}
    {% include "core/_exercise_modal.html" %}

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const exerciseButton = document.getElementById("log-exercise-btn");
        const exerciseModal = document.getElementById("exercise-modal");
        const cancelExerciseButton = document.getElementById("cancel-exercise-btn");
        const exerciseSelect = document.getElementById("exercise-type");
        const repetitionFields = document.getElementById("repetition-fields");
        const durationFields = document.getElementById("duration-fields");
        const distanceFields = document.getElementById("distance-fields");
        
        if (exerciseButton && exerciseModal) {
            exerciseButton.addEventListener("click", function () {
                exerciseModal.showModal();
            });
        }

        if (cancelExerciseButton && exerciseModal) {
            cancelExerciseButton.addEventListener("click", function () {
                exerciseModal.close();
            });
        }

        if (exerciseSelect && repetitionFields) {
            exerciseSelect.addEventListener("change", function () {
                const selectedOption = exerciseSelect.selectedOptions[0];

                const inputType = selectedOption.dataset.inputType;

                repetitionFields.hidden = inputType !== "reps";
            });
        }

        if (exerciseSelect && repetitionFields && durationFields) {
            exerciseSelect.addEventListener("change", function () {
                const selectedOption = exerciseSelect.selectedOptions[0];
                const inputType = selectedOption.dataset.inputType;

                repetitionFields.hidden = inputType !== "reps";
                durationFields.hidden = inputType !== "duration";
            });
        }

        if (exerciseSelect && repetitionFields && durationFields && distanceFields) {
            exerciseSelect.addEventListener("change", function () {
                const selectedOption = exerciseSelect.selectedOptions[0];
                const inputType = selectedOption.dataset.inputType;

                repetitionFields.hidden = inputType !== "reps";
                durationFields.hidden = inputType !== "duration";
                distanceFields.hidden = inputType !== "distance";
            });
        }

    });
    </script>

</body>
</html>
