{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <audio id="bg-music" src="{% static 'audio/ES_Casanova_Instrumental.mp3' %}" autoplay loop></audio>
    <link rel="stylesheet" href="{% static 'css/home.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'css/repkin_modals.css' %}">
    <link rel="stylesheet" href="{% static 'css/repkin_bubble.css' %}">
    <style>
        .repkin-summary p {
            margin: 0 0 0.5rem;
        }
        .repkin-summary button {
            padding: 0.45rem 0.7rem;
            font: inherit;
        }
    </style>
</head>
<body>

    <div class="stage">

        <img src="{% static 'img/workout_room.png' %}" alt="Workout room" class="room">
        <!-- Show the Repkin sprite selected for this account. -->
        <img src="{% static repkin_sprite %}" alt="Repkin"
            class="user-base-gif{% if sprite_needs_vertical_offset %} non-green-no-legs{% endif %}"
            id="repkin-sprite">
        {% include "core/_repkin_bubble.html" %}

        <!--Locker Room Button-->
        <a href="{% url 'core:locker_room' %}" class="locker-room-btn" id="locker-room-btn"></a>

        <button class="main_menu_button"
                id="mainMenuButton"
                aria-label="Open menu"
                aria-expanded="false">
        </button>

        <form class="repkin-state-control" method="post" action="{% url 'core:toggle_repkin_tired' %}">
            {% csrf_token %}
            <input type="hidden" name="return_to" value="home">
            <button type="submit" aria-pressed="{{ repkin.is_tired|yesno:'true,false' }}">
                {% if repkin.is_tired %}Set not tired{% else %}Set tired{% endif %}
            </button>
        </form>

        <div class="repkin-summary">
            <p>Signed in as <span data-mirror="cur-user-name">{{ user.first_name|default:"Player" }}</span></p>
            <p><span data-mirror="cur-repkin-name">{{ repkin.name|default:"Your RepKin" }}</span>: mood {{ repkin.mood }}, color {{ repkin.color }}</p>
        </div>

        <!-- Workout Logging: the dumbbell opens the workout builder page -->
        <a href="{% url 'core:workout_logging' %}" id="workout-logging-btn" class="stage_button"
           aria-label="Workout logging"
           style="--l:62%; --t:0.6%; --w:13.8%; --h:7.6%"></a>
            
        {% include "core/main_menu.html" %}
</div>

    
    {% include "core/_repkin_modals.html" %}



<script src="{% static 'js/workout_logged.js' %}"></script>
<script src="{% static 'js/unit_conversion.js' %}"></script>
<script src="{% static 'js/main_menu.js' %}"></script>
<script src="{% static 'js/profile.js' %}"></script>
</body>
</html>
