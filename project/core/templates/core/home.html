{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <audio id="bg-music" src="{% static 'audio/ES_Casanova_Instrumental.mp3' %}" autoplay loop></audio>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/repkin_modals.css' %}">
    <style>
        .repkin-summary p {
            margin: 0 0 0.5rem;
        }
        .repkin-summary button {
            padding: 0.45rem 0.7rem;
            font: inherit;
        }
        .practice-panel {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 5;
            box-sizing: border-box;
            width: min(22rem, calc(100vw - 2rem));
            max-height: calc(100dvh - 2rem);
            overflow-y: auto;
            padding: 1rem;
            color: #f7f7f2;
            background: rgba(22, 31, 29, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            font-family: system-ui, sans-serif;
        }
        .practice-panel h1 {
            margin: 0 0 0.75rem;
            font-size: 1.2rem;
        }
        .practice-panel label,
        .practice-panel input,
        .practice-panel button {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        .practice-panel input,
        .practice-panel button {
            min-height: 2.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.65rem;
            font: inherit;
        }
        .practice-panel button {
            color: #10211c;
            background: #b8e2c5;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        .practice-panel button:disabled {
            cursor: wait;
            opacity: 0.7;
        }
        .practice-result {
            min-height: 1.5em;
            margin: 0.75rem 0 0;
        }
    </style>
</head>
<body>

    <div class="stage">

        <img src="{% static 'img/workout_room.png' %}" alt="Workout room" class="room">
        <img src="{% static 'gifs/(Base)TiredAnimation.gif' %}" alt="Repkin" class="user-base-gif">

<!--Locker Room Button-->
<a href="{% url 'core:locker_room' %}" class="locker-room-btn" id="locker-room-btn"></a>

<button class="main_menu_button"
        id="mainMenuButton"
        aria-label="Open menu"
        aria-expanded="false">
</button>

<div class="repkin-summary">
    <p>Signed in as {{ user.username }}</p>
    <p>{{ user.username }}'s RepKin: mood {{ repkin.mood }}, color {{ repkin.color }}</p>

    <button
        type="button"
        id="log-exercise-btn"
        data-exercise-modal="exercise-modal">
        Log Exercise
    </button>
</div>

    <div id="mainMenu" class="main_menu hidden">
    <div class="menu_panel">


        <img id="menuArt"
            src="{% static 'img/main_menu_pngs/main_menu_starter.png' %}"
            alt="Main Menu" class="main_menu_png"
            data-lbs-on="{% static 'img/main_menu_pngs/main_menu_starter.png' %}"
            data-lbs-off="{% static 'img/main_menu_pngs/main_menu_lbs_off.png' %}"
            data-kgs-on="{% static 'img/main_menu_pngs/main_menu_kgs_on.png' %}"
            data-kgs-off="{% static 'img/main_menu_pngs/main_menu_kgs_off.png' %}">

        <button type="button" id="menuExitButton" class="menu_field" aria-label="Close menu"
                style="--l:85%; --t:5.2%; --w:5.2%; --h:4.6%"></button>

        <!-- Name -->
        <input class="menu_field" readonly value="{{ user.first_name }}" aria-label="Current Repkin name"
            style="--l:55.5%; --t:19.7%; --w:20%; --h:2.7%">
        <form class="menu_form">
            <input class="menu_field" name="name" aria-label="Change Repkin name"
                style="--l:55.5%; --t:23.3%; --w:20%; --h:2.7%">
            <button type="submit" class="menu_field" aria-label="Submit Repkin name"
                    style="--l:68%; --t:26%; --w:8%; --h:1.8%"></button>
        </form>

        <!-- Username -->
        <input class="menu_field" readonly value="{{ user.username }}" aria-label="Current  username"
            style="--l:55.5%; --t:32%; --w:20%; --h:2.7%">
        <form class="menu_form">
            <input class="menu_field" name="username" aria-label="Change username"
                style="--l:55.5%; --t:35.5%; --w:20%; --h:2.7%">
            <button type="submit" class="menu_field" aria-label="Submit username"
                    style="--l:68%; --t:38.5%; --w:8%; --h:1.8%"></button>
        </form>

        <!-- Height -->
        <input class="menu_field" readonly aria-label="Current height"
            style="--l:55.9%; --t:48.5%; --w:20%; --h:2.7%">
        <form class="menu_form">
            <input class="menu_field" name="height" aria-label="Update height"
                style="--l:55.8%; --t:52%; --w:20%; --h:2.7%">
            <button type="submit" class="menu_field" aria-label="Submit height"
                    style="--l:69%; --t:54.5%; --w:8%; --h:1.8%"></button>
        </form>

        <!-- Weight -->
        <input class="menu_field" readonly aria-label="Current weight"
            style="--l:55.9%; --t:61.1%; --w:20%; --h:2.6%">
        <form class="menu_form">
            <input class="menu_field" name="weight" aria-label="Update weight"
                style="--l:55.9%; --t:64.5%; --w:20%; --h:2.4%">
            <button type="submit" class="menu_field" aria-label="Submit weight"
                    style="--l:69%; --t:67%; --w:8%; --h:1.8%"></button>
        </form>

        <!-- Bottom buttons -->
        <button type="button" class="menu_field" aria-label="Credits"
                style="--l:65.5%; --t:88.7%; --w:10%; --h:3.7%"></button>
        <form method="post" action="{% url 'core:logout' %}">
            {% csrf_token %}
            <button type="submit" class="menu_field" aria-label="Log out"
                    style="--l:77.5%; --t:88.7%; --w:12%; --h:3.7%"></button>
        </form>

        <!-- Credits button (invisible, over the drawn Credits box) -->
        <button type="button" id="creditsButton" class="menu_field" aria-label="View credits"
            style="--l:65.5%; --t:88.7%; --w:10%; --h:3.7%"></button>

        <!-- Credits screen, laid over the menu -->
        <div id="creditsOverlay" class="credits_overlay hidden">
            <img src="{% static 'img/credits.png' %}" alt="Credits" class="credits_png">
            <button type="button" id="creditsExitButton" class="credits_exit_button" aria-label="Close credits"></button>
        </div>

        <!-- Music Control -->
        <button type="button" id="musicBtn" class="menu_field" aria-label="Music" aria-pressed="true"
            style="--l:40.8%; --t:77.7%; --w:3.8%; --h:3.2%"></button>
        <button type="button" id="lbsBtn" class="menu_field" aria-label="Pounds" aria-pressed="true"
                style="--l:40.8%; --t:84.2%; --w:3.8%; --h:3.3%"></button>
        <button type="button" id="kgsBtn" class="menu_field" aria-label="Kilograms" aria-pressed="false"
                style="--l:46.9%; --t:84.2%; --w:3.8%; --h:3.3%"></button>
    </div>
</div>
    </div>

    <main>
        <section class="practice-panel" aria-labelledby="practice-title">
            <h1 id="practice-title">Practice data check</h1>
            <form id="practice-data-form" method="post" action="{% url 'core:practice_data' %}">
                {% csrf_token %}
                <label for="practice-pushups">Sample push-up count</label>
                <input id="practice-pushups" name="practice_pushups" type="number" min="0" max="10000" value="7" required>
                <button type="submit">Save sample</button>
            </form>
            <button id="load-practice-data" type="button">Load saved value</button>
            <p id="practice-result" class="practice-result" role="status" aria-live="polite">Nothing saved yet.</p>
        </section>
    </main>

    <script src="{% static 'core/practice_data.js' %}" defer></script>
    {% include "core/_repkin_modals.html" %}
    {% include "core/_exercise_modal.html" %}

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const exerciseButton = document.getElementById("log-exercise-btn");
        const exerciseModal = document.getElementById("exercise-modal");
        const cancelExerciseButton = document.getElementById("cancel-exercise-btn");
        const exerciseSelect = document.getElementById("exercise-type");
        const repetitionFields = document.getElementById("repetition-fields");
        const durationFields = document.getElementById("duration-fields");
        const distanceFields = document.getElementById("distance-fields");
        const exerciseForm = document.getElementById("exercise-form");
        const exerciseFeedback = document.getElementById("exercise-feedback");
        const submitExerciseButton = document.getElementById("submit-exercise-btn");

        if (exerciseButton && exerciseModal) {
            exerciseButton.addEventListener("click", function () {
                exerciseModal.showModal();
            });
        }

        if (cancelExerciseButton && exerciseModal) {
            cancelExerciseButton.addEventListener("click", function () {
                exerciseModal.close();
            });
        }

        if (exerciseSelect && repetitionFields && durationFields && distanceFields) {
            exerciseSelect.addEventListener("change", function () {
                const selectedOption = exerciseSelect.selectedOptions[0];
                const inputType = selectedOption.dataset.inputType;

                repetitionFields.hidden = inputType !== "reps";
                durationFields.hidden = inputType !== "duration";
                distanceFields.hidden = inputType !== "distance";
                exerciseFeedback.textContent = "";
            });
        }

        if (exerciseForm && exerciseFeedback && submitExerciseButton) {
            exerciseForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                exerciseFeedback.hidden = true;
                exerciseFeedback.textContent = "";
                submitExerciseButton.disabled = true;

                try {
                    const formData = new FormData(exerciseForm);

                    const response = await fetch(exerciseForm.action, {
                        method: "POST",
                        body: formData,
                        credentials: "same-origin"
                    });

                    const result = await response.json();

                    if (response.ok && result.success === true) {
                        exerciseFeedback.textContent =
                            "Exercise submitted successfully!";

                        // We'll reset the modal after backend integration.
                    } else if (response.status === 400) {
                        exerciseFeedback.textContent =
                            "Please check your exercise information.";
                    } else {
                        exerciseFeedback.textContent =
                            result.error || "Exercise could not be submitted.";
                    }

                    exerciseFeedback.hidden = false;

                } catch (error) {
                    exerciseFeedback.textContent =
                        "Unable to submit exercise. Please try again.";
                    exerciseFeedback.hidden = false;

                } finally {
                    submitExerciseButton.disabled = false;
                }
            });
        }
    });

    /* Music and Unit Toggles */
    const menuArt = document.getElementById("menuArt");
    const music = document.getElementById("bg-music");
    const musicBtn = document.getElementById("musicBtn");
    const lbsBtn = document.getElementById("lbsBtn");
    const kgsBtn = document.getElementById("kgsBtn");
    let unit = "lbs";
    let musicOn = true;

    function renderMenuArt() {
        menuArt.src = menuArt.dataset[unit + (musicOn ? "On" : "Off")];
        musicBtn.setAttribute("aria-pressed", String(musicOn));
        lbsBtn.setAttribute("aria-pressed", String(unit === "lbs"));
        kgsBtn.setAttribute("aria-pressed", String(unit === "kgs"));
        if (musicOn) { music.play().catch(() => {}); } else { music.pause(); }
    }

    musicBtn.addEventListener("click", () => { musicOn = !musicOn; renderMenuArt(); });
    lbsBtn.addEventListener("click", () => { unit = "lbs"; renderMenuArt(); });
    kgsBtn.addEventListener("click", () => { unit = "kgs"; renderMenuArt(); });

    // browsers block autoplay with sound, so start on the first click if music is on
    document.addEventListener("pointerdown", () => {
        if (musicOn && music.paused) music.play().catch(() => {});
    }, { once: true });
    </script>

<script src="{% static 'js/main_menu.js' %}"></script>
</body>
</html>
